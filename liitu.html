<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="assets/logo.png">
<title>Liitu klubiga — Drivers Club</title>
<meta name="description" content="Liitu Drivers Clubi kogukonnaga. Klassikaliste autode klubi Eestis." />
<meta name="dc-api-base" content="https://drivers-club-api-production-6052.up.railway.app">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9DVS8W6CKL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-9DVS8W6CKL');
</script>
</head>
<body class="density-compact auth-page">

<nav class="nav nav-slim">
  <div class="nav-inner">
    <a href="index.html" class="brandmark" aria-label="Drivers Club">
      <img class="brand-logo" src="assets/logo.png" srcset="assets/logo.png 1x, assets/logo@2x.png 2x" alt="" width="42" height="42"/>
      <span class="brand-stack">
        <span class="word">Drivers Club</span>
        <span class="sub">Driven by Passion</span>
      </span>
    </a>
    <a href="index.html" class="nav-cta">Tagasi avalehele</a>
  </div>
</nav>

<main class="auth-shell">
  <div class="auth-bg"></div>
  <div class="auth-grain"></div>

  <section class="auth-card auth-card-wide">
    <div class="section-eyebrow">
      <span class="num">01</span>
      <span class="line"></span>
      <span>Liitu klubiga</span>
    </div>
    <h1 class="auth-title">Loo <span class="it">konto.</span></h1>
    <p class="auth-lede">
      Üks ringkond, jagatud kirg. Loo konto, et registreeruda sõitudele ja näha klubi sisu.
    </p>

    <form id="register-form" class="auth-form" novalidate>
      <label class="field">
        <span class="field-label">Eesnimi</span>
        <input type="text" name="firstName" autocomplete="given-name" required maxlength="80" placeholder="Mart"/>
      </label>

      <label class="field">
        <span class="field-label">E-post</span>
        <input type="email" name="email" autocomplete="email" required maxlength="200" placeholder="mart@näide.ee"/>
      </label>

      <label class="field">
        <span class="field-label">Parool <span class="field-hint">(vähemalt 8 tähemärki)</span></span>
        <input type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="200" placeholder="••••••••"/>
      </label>

      <label class="field">
        <span class="field-label">Auto <span class="field-hint">(soovi korral)</span></span>
        <input type="text" name="car" autocomplete="off" maxlength="200" placeholder="nt. BMW M6 (2006)"/>
      </label>

      <div id="register-error" class="auth-error" hidden></div>

      <button type="submit" class="btn btn-primary auth-submit">
        Loo konto <span class="arrow-r"></span>
      </button>
    </form>

    <p class="auth-footer">
      Sul on juba konto? <a href="logi-sisse.html">Logi sisse.</a>
    </p>
  </section>
</main>

<script src="assets/auth.js"></script>
<script>
  (async function () {
    const me = await DC.me();
    if (me) { window.location.replace('minu-konto.html'); return; }

    const form  = document.getElementById('register-form');
    const error = document.getElementById('register-error');
    const submit = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.hidden = true;
      const fd = new FormData(form);
      const car = (fd.get('car') || '').toString().trim();
      const payload = {
        firstName: fd.get('firstName').toString().trim(),
        email:     fd.get('email').toString().trim(),
        password:  fd.get('password'),
        car:       car || null,
      };
      submit.disabled = true;
      submit.textContent = 'Loon kontot…';
      try {
        await DC.register(payload);
        window.location.assign('minu-konto.html');
      } catch (err) {
        error.textContent = err.message || 'Konto loomine ebaõnnestus.';
        error.hidden = false;
        submit.disabled = false;
        submit.innerHTML = 'Loo konto <span class="arrow-r"></span>';
      }
    });
  })();
</script>

</body>
</html>
